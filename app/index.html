<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>make.fun bounties</title>
<style>
:root{--ac:#c2185b;--ac2:#fce4ef;--ink:#17151c;--mut:#5d5a68;--bg:#f6f5f8;--card:#fff;--line:#e6e2ec;--ok:#1b7f4b;--sk:#ebe8ef}
[data-theme=dark]{--ac:#f48fb1;--ac2:#3b1f2d;--ink:#ecebf1;--mut:#a9a5b5;--bg:#121116;--card:#1c1b22;--line:#34313d;--ok:#5fd394;--sk:#24222b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui;color:var(--ink);background:var(--bg)}
a{color:var(--ac);text-decoration:none}
.top{position:sticky;top:0;display:flex;align-items:center;gap:22px;padding:10px max(20px,50% - 620px);background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-size:21px;color:var(--ink);font-weight:700}.logo b{color:var(--ac)}
.logo small{margin-left:6px;font-size:12px;color:var(--mut);text-transform:uppercase}
nav{display:flex;gap:4px}
nav>*{font:inherit;color:var(--ink);font-weight:600;padding:6px 12px;border-radius:99px;border:0;background:none}
form{flex:1;max-width:360px;margin-left:auto}
form input{width:100%;font:inherit;color:var(--ink);padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--bg)}
.live{font-size:13px;font-weight:600;color:var(--ok)}
.theme{width:36px;height:36px;opacity:0}
main{max-width:1240px;margin:0 auto;padding:18px 20px 24px}
.sk{border-radius:14px;background:var(--sk);height:70vh}
@media (max-width:860px){.top{flex-wrap:wrap;gap:8px 14px;padding:10px 14px}form{order:9;flex-basis:100%;max-width:none}main{padding:14px 12px}}
@media (max-width:639px){.live{margin-left:auto}nav{position:fixed;inset:auto 0 0;padding:4px 6px;background:var(--card);border-top:1px solid var(--line)}nav>*{display:grid!important;place-items:center;flex:1;min-height:52px}}
</style>
<header class="top"><a class="logo" href="#/"><b>make</b>.fun<small>bounties</small></a><nav><a href="#/">Bounties</a><a href="#/builders">Builders</a><button hidden data-search>Search</button></nav>
<form><input type="search" placeholder="Search bounties or @handle" aria-label="Search"></form><span class="live">Live</span><button class="theme" aria-label="Dark theme"></button></header>
<main></main>
<footer class="meter"></footer>
<script type="module">// route · cachedFetch + revalidate (memory cache, in-flight dedupe, ETag) · meter
try{document.documentElement.dataset.theme=localStorage.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'')}catch{}
const API='https://make.fun/api',cache=new Map,inflight=new Map,main=document.querySelector('main'),
VIEWS={board:()=>import('./views/board.js'),leaderboard:()=>import('./views/leaderboard.js'),profile:()=>import('./views/profile.js'),builders:()=>import('./views/profile.js'),none:()=>import('./views/shared.js')};
let view,seq=0;
async function route(live){
  const[path,query='']=location.hash.replace(/^#\/?/,'').split('?'),[a,b,c]=path.split('/').map(decodeURIComponent),args={a,b,c,query},
  kind=!a||a=='bounty'&&b&&!c?'board':a=='bounty'&&c=='leaderboard'?'leaderboard':a=='u'&&b?'profile':a=='builders'&&!b?'builders':'none';
  if(live)return view?.path==path&&view.run(view.el,args,1);
  const my=++seq,el=document.createElement('div');
  meter.reset(my>1&&performance.now());self.__shotReady=!1;
  if(kind=='board'&&view?.kind==kind)return view.path=path,view.mod.selectBounty(view.el,a&&b,query).then(()=>ready(my));
  main.innerHTML='<div class=sk>';scrollTo(0,0);
  let mod,run;
  try{[mod]=await Promise.all([VIEWS[kind](),import('./views/style.js')]);await(run=mod[kind])(el,args)}
  catch(e){el.innerHTML='<p class=empty>Could not load: <b></b> <button data-retry>Retry</button>';el.querySelector('b').textContent=e.message}
  if(my==seq)view={el,path,kind,mod,run},main.replaceChildren(el),ready(my);
}
function cachedFetch(path,fresh){
  const hit=cache.get(path);
  if(hit&&!fresh&&Date.now()-hit.at<6e4||inflight.has(path))return meter.add('mem'),inflight.get(path)||Promise.resolve(hit.data);
  inflight.set(path,revalidate(path,hit).finally(()=>inflight.delete(path)));return inflight.get(path);
}
async function revalidate(path,hit){
  meter.add('req');let res;
  try{res=await fetch(API+path,{cache:'no-cache',signal:AbortSignal.timeout(2e4)})}catch(e){if(hit)return hit.data;throw e}
  const etag=res.headers.get('ETag');
  if(hit&&etag&&etag==hit.etag)return meter.add('etag'),hit.at=Date.now(),hit.data;
  if(!res.ok)throw Error(res.status==404?'Not found':'HTTP '+res.status);
  const text=await res.text(),data=JSON.parse(text),t=performance.getEntriesByName(res.url).at(-1)?.transferSize;
  meter.add(t?'wire':'json',t||text.length);cache.set(path,{data,etag,at:Date.now()});return data;
}
const meter={reset(t0){Object.assign(meter,{req:0,mem:0,etag:0,wire:0,json:0,patched:0,t0,ms:0}).show()},add(k,n=1){meter[k]+=n;meter.show()},show(){self.mf?.draw?.(meter)}};
function ready(my){if(my==seq)meter.ms=Math.round(performance.now()-meter.t0),meter.show(),mf.ready?.(),self.__shotReady=!0}
self.mf={route,cachedFetch,meter,get view(){return view}};
onhashchange=()=>route();route();
</script>
