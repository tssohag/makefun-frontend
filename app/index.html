<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width">
<title>make.fun bounties</title>
<script>function route(){
const[path,query='']=location.hash.replace(/^#\/?/,'').split('?'),[a,b,c]=path.split('/').map(decodeURIComponent),
kind=!a||a=='bounty'&&b&&!c?'board':a=='bounty'&&c=='leaderboard'?'leaderboard':a=='u'&&b?'profile':a=='builders'&&!b?'builders':'none';
return{path,kind,a,b,c,query,load:VIEWS[kind]}}
const VIEWS={board:()=>import('./views/board.js'),leaderboard:()=>import('./views/leaderboard.js'),profile:()=>import('./views/profile.js'),builders:()=>import('./views/profile.js'),none:()=>import('./views/shared.js')}</script>
<script>function cachedFetch(path,fresh){ // 60s cache, in-flight dedupe; revalidate ETag; meter
const hit=cache.get(path);
if(hit&&!fresh&&Date.now()-hit.at<6e4||inflight.has(path))return meter.add('mem'),inflight.get(path)||Promise.resolve(hit.data);
inflight.set(path,revalidate(path,hit).finally(()=>inflight.delete(path)));return inflight.get(path)}
const API='https://make.fun/api',cache=new Map,inflight=new Map</script>
<script>async function revalidate(path,hit){
meter.add('req');let res;
try{res=await fetch(API+path,{cache:'no-cache',signal:AbortSignal.timeout(2e4)})}catch(e){if(hit)return hit.data;throw e}
const etag=res.headers.get('ETag');
if(hit&&etag&&etag==hit.etag)return meter.add('etag'),hit.at=Date.now(),hit.data;
if(!res.ok)throw Error(res.status==404?'Not found':'HTTP '+res.status);
const text=await res.text(),data=JSON.parse(text),t=performance.getEntriesByName(res.url).at(-1)?.transferSize;
meter.add(t?'wire':'json',t||text.length);cache.set(path,{data,etag,at:Date.now()});return data}</script>
<script>const meter={
reset(t0){self.__shotReady=!1;Object.assign(meter,{req:0,mem:0,etag:0,wire:0,json:0,bg:0,bkb:0,patched:0,t0:t0||0,ms:0}).show()},
add(k,n=1){meter.ms&&!/m|g/.test(k)&&(k=k=='req'?'bg':'bkb');meter[k]+=n;meter.show()},
show(){mf.draw?.(meter)}};
self.mf={route,cachedFetch,revalidate,meter};
try{document.documentElement.dataset.theme=localStorage.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'')}catch{}
document.documentElement.dataset.k=route().kind;
import('./views/shared.js').catch(e=>document.querySelector('main').textContent=e.message)</script>

@media(min-width:1000px){[data-k=board] .sk{background:linear-gradient(90deg,var(--line) 640px,#0000 0 658px,var(--line) 0)}}
